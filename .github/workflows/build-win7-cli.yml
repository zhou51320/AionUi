name: '🪟 Build Win7 AionCore + Desktop'

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch, tag or commit to build'
        required: true
        default: 'main'
        type: string
      aioncore_run_id:
        description: 'Existing AionCore workflow run id; required for desktop packaging'
        required: false
        default: ''
        type: string
env:
  CARGO_TERM_COLOR: always
  CARGO_HTTP_TIMEOUT: '600'
  CARGO_NET_RETRY: '10'

jobs:
  build-win7-cli:
    name: Build Aion CLI for Windows 7 (x64)
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Install Rust Nightly Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'AionCore -> target'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Python (build helper)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install desktop dependencies
        shell: bash
        run: |
          bun install --frozen-lockfile
          bun run postinstall || true

      - name: Build Aion CLI (x86_64-win7-windows-msvc)
        if: ${{ !inputs.aioncore_run_id }}
        shell: bash
        working-directory: AionCore
        run: |
          cargo +nightly build --release \
            --target x86_64-win7-windows-msvc \
            -Zbuild-std=std,panic_abort \
            -p aionui-app

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Verify Windows 7 PE Compatibility
        if: ${{ !inputs.aioncore_run_id }}
        shell: powershell
        run: |
          $cliPath = "AionCore/target/x86_64-win7-windows-msvc/release/aioncore.exe"
          if (-not (Test-Path $cliPath)) {
            Write-Error "Binary not found at $cliPath"
            exit 1
          }
          Write-Host "Verifying PE binary compatibility for Windows 7: $cliPath" -ForegroundColor Green
          & scripts/verify-win7-compat.ps1 -ExePath $cliPath

      - name: Prepare local AionCore bundle for desktop packaging
        if: ${{ !inputs.aioncore_run_id }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $cliPath = Resolve-Path "AionCore/target/x86_64-win7-windows-msvc/release/aioncore.exe"
          $bundleDir = Join-Path $PWD "resources/bundled-aioncore-local/win32-x64"
          $managedDir = Join-Path $bundleDir "managed-resources"
          $dataDir = Join-Path $PWD "dist/aioncore-prepare-data"
          New-Item -ItemType Directory -Force -Path $bundleDir, $managedDir, $dataDir | Out-Null
          Copy-Item $cliPath (Join-Path $bundleDir "aioncore.exe") -Force
          & $cliPath --data-dir $dataDir prepare-managed-resources --bundle-out $managedDir
          if ($LASTEXITCODE -ne 0) { throw "prepare-managed-resources failed with exit code $LASTEXITCODE" }
          Remove-Item $dataDir -Recurse -Force -ErrorAction SilentlyContinue
          node -e "const fs=require('fs'); const p='resources/bundled-aioncore-local/win32-x64/managed-resources/manifest.json'; if(!fs.existsSync(p)) throw new Error('managed-resources manifest missing'); console.log('managed-resources ready')"

      - name: Download reusable AionCore artifact
        if: ${{ inputs.aioncore_run_id }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          AIONUI_BACKEND_RUN_ID: ${{ inputs.aioncore_run_id }}
          AIONUI_BACKEND_ARCH: x64
          AIONUI_BACKEND_REPO_OWNER: zhou51320
          AIONUI_BACKEND_REPO_NAME: AionUi
          AIONUI_BACKEND_ARTIFACT_NAME: aioncore-win7-x64
        run: node scripts/prepareAioncore.js

      - name: Prepare offline PDF runtime
        shell: bash
        run: node scripts/prepare-pdf-runtime.js --platform win32 --arch x64

      - name: Build Win7 NSIS desktop installer
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_OPTIONS: '--max-old-space-size=8192'
          ELECTRON_BUILDER_COMPRESSION_LEVEL: '5'
          npm_config_arch: x64
          npm_config_target_arch: x64
          npm_config_runtime: electron
          npm_config_disturl: https://electronjs.org/headers
          ELECTRON_WIN7: '1'
          AIONUI_BACKEND_RUN_ID: ${{ inputs.aioncore_run_id }}
          AIONUI_BACKEND_REPO_OWNER: zhou51320
          AIONUI_BACKEND_REPO_NAME: AionUi
          AIONUI_BACKEND_ARTIFACT_NAME: aioncore-win7-x64
          CI: 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/build-with-builder.js x64 --win --x64 --win7
          $installer = Get-ChildItem -Path out -Filter '*.exe' | Where-Object { $_.Name -notlike '*aioncore*' } | Select-Object -First 1
          if (-not $installer) { throw 'Win7 NSIS installer was not generated' }
          $packagedCore = 'out/win-unpacked/resources/bundled-aioncore/win32-x64/aioncore.exe'
          if (-not (Test-Path $packagedCore)) { throw "Packaged AionCore missing: $packagedCore" }
          $managedManifest = 'out/win-unpacked/resources/bundled-aioncore/win32-x64/managed-resources/manifest.json'
          if (-not (Test-Path $managedManifest)) { throw "Packaged managed resources missing: $managedManifest" }
          $managedNode = 'out/win-unpacked/resources/bundled-aioncore/win32-x64/managed-resources/node/node-v24.11.0-win-x64/node.exe'
          if (-not (Test-Path $managedNode)) { throw "Packaged managed Node missing: $managedNode" }
          & scripts/verify-win7-compat.ps1 -ExePath $packagedCore
          if (-not (Test-Path 'out/win-unpacked/resources/pdf-runtime/manifest.json')) { throw 'Packaged PDF runtime manifest missing' }
          Write-Host "Win7 NSIS installer generated: $($installer.FullName)"

      - name: Prepare Artifact
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "dist/win7-cli"
          $core = 'resources/bundled-aioncore-local/win32-x64/aioncore.exe'
          if (-not (Test-Path $core)) { $core = 'resources/bundled-aioncore/win32-x64/aioncore.exe' }
          Copy-Item $core "dist/win7-cli/aioncore.exe"
          Compress-Archive -Path "dist/win7-cli/*" -DestinationPath "aioncore-win7-x64.zip" -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aioncore-win7-x64
          path: aioncore-win7-x64.zip
          retention-days: 14

      - name: Upload Win7 NSIS desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aionui-win7-nsis
          path: |
            out/*.exe
            out/*portable.zip
          if-no-files-found: error
          retention-days: 14
