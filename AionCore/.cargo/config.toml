[net]
git-fetch-with-cli = true

# Windows 7 Tier 3 compilation target configuration
# Statically links the C runtime to avoid MSVCR dependencies incompatible with Win7
[target.x86_64-win7-windows-msvc]
rustflags = [
    "-C", "target-feature=+crt-static",
    "-C", "link-arg=/DELAYLOAD:api-ms-win-core-winrt-l1-1-0.dll",
    "-C", "link-arg=/DELAYLOAD:api-ms-win-core-winrt-string-l1-1-0.dll",
    "-C", "link-arg=/DELAYLOAD:api-ms-win-core-winrt-error-l1-1-0.dll",
    "-C", "link-arg=delayimp.lib",
]
