name: '🪟 Build Win7 Aion CLI'

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch, tag or commit to build'
        required: true
        default: 'main'
        type: string
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  CARGO_HTTP_TIMEOUT: '600'
  CARGO_NET_RETRY: '10'

jobs:
  build-win7-cli:
    name: Build Aion CLI for Windows 7 (x64)
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Install Rust Nightly Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Aion CLI (x86_64-win7-windows-msvc)
        shell: bash
        run: |
          cargo +nightly build --release \
            --target x86_64-win7-windows-msvc \
            -Zbuild-std=std,panic_abort \
            -p aionui-app

      - name: Prepare Artifact
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "dist/win7-cli"
          Copy-Item "target/x86_64-win7-windows-msvc/release/aioncore.exe" "dist/win7-cli/aioncore.exe"
          Compress-Archive -Path "dist/win7-cli/*" -DestinationPath "aioncore-win7-x64.zip" -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aioncore-win7-x64
          path: aioncore-win7-x64.zip
          retention-days: 14
